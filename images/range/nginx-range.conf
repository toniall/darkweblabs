# Range web backends — Chapter 8. Each service listens on its own port so Tor can
# publish it as its own onion. All content is synthetic and watermarked (seed.py).
# The market and forum gate protected paths behind a session cookie (Lab 8.3).
server {
    listen 8080;
    server_name _;
    root /content/directory;
    index index.html;
}

server {                    # market — stateful: /listings needs a session
    listen 8081;
    server_name _;
    root /content/market;
    index index.html;

    location = /login { default_type text/plain; return 200 "range market login (synthetic) - sign in to view listings\n"; }
    location /listings {
        if ($http_cookie !~ "session=") { return 302 /login; }
        try_files $uri $uri/ /index.html;
    }
}

server {                    # forum — member boards need a session
    listen 8082;
    server_name _;
    root /content/forum;
    index index.html;

    location = /login { default_type text/plain; return 200 "range forum login (synthetic)\n"; }
    location /members {
        if ($http_cookie !~ "session=") { return 302 /login; }
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8083;
    server_name _;
    root /content/leak;
    index index.html;
}

server {
    listen 8084;
    server_name _;
    root /content/paste;
    index index.html;
}

server {                    # clone backend (range-web-clone) — altered pgp+btc
    listen 8091;
    server_name _;
    root /content/market-clone;
    index index.html;
}
